// Admin protocol between muructl (and the dashboard's JSON gateway) and the
// daemon (design specification section 10.6 and appendix B). Served over the
// admin Unix socket. Messages change additively within a major version.
//
// This is the first slice: applications, releases, deploys, rollback,
// drains, events and daemon status. The remaining resources and operations
// of appendix B are added as their features land.

syntax = "proto3";

package muru.admin.v1;

service Admin {
  // The daemon, its locations and listeners.
  rpc GetStatus(GetStatusRequest) returns (Status);

  // Applications.
  rpc ListApps(ListAppsRequest) returns (ListAppsResponse);
  rpc GetApp(GetAppRequest) returns (App);

  // Create a release from a source directory and apply the application's
  // default strategy (blue/green): start it, move traffic when it is
  // ready, drain the previous release.
  rpc Deploy(DeployRequest) returns (Release);

  // Releases.
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc GetRelease(GetReleaseRequest) returns (Release);
  // Block until the release reaches one of the states, or the deadline.
  rpc WaitRelease(WaitReleaseRequest) returns (Release);
  // Restore traffic to the previous release of the application.
  rpc Rollback(RollbackRequest) returns (Release);
  // Drain a release: no new traffic, requests in flight finish, then stop.
  rpc DrainRelease(DrainReleaseRequest) returns (Release);

  // Section 9.3: shift an application's traffic to a release step by step,
  // with gates, and control the rollout; or move all of it at once.
  rpc StartRollout(StartRolloutRequest) returns (Rollout);
  rpc GetRollout(GetRolloutRequest) returns (Rollout);
  rpc ListRollouts(ListRolloutsRequest) returns (ListRolloutsResponse);
  rpc PauseRollout(RolloutControlRequest) returns (Rollout);
  rpc ResumeRollout(RolloutControlRequest) returns (Rollout);
  rpc PromoteRollout(RolloutControlRequest) returns (Rollout);
  rpc AbortRollout(RolloutControlRequest) returns (Rollout);
  rpc PromoteRelease(PromoteReleaseRequest) returns (Release);

  // Section 7.4: pin or release a worker group's count, and read the
  // autoscaler's signals, decisions and churn for a release.
  rpc SetScale(SetScaleRequest) returns (ScaleStatus);
  rpc GetScaleStatus(GetScaleStatusRequest) returns (ScaleStatus);
  // Section 4.12: serve the maintenance page for an application at the
  // edge, or serve it as usual again.
  rpc SetMaintenance(SetMaintenanceRequest) returns (MaintenanceStatus);

  // Events, from a sequence number.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc WatchEvents(WatchEventsRequest) returns (stream Event);

  // Stop the daemon: detaching by default, or draining everything first.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);

  // Virtual hosts and routes (sections 4.3 and 4.5), as applied.
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  rpc ListRoutes(ListRoutesRequest) returns (ListRoutesResponse);

  // HTTP upstreams (section 4.13), as applied.
  rpc ListUpstreams(ListUpstreamsRequest) returns (ListUpstreamsResponse);

  // Declarative configuration (section 10.4): apply a document, compare
  // one with desired state, or export desired state as one.
  rpc ApplyConfig(ApplyConfigRequest) returns (ConfigReport);
  rpc DiffConfig(DiffConfigRequest) returns (ConfigReport);
  rpc ExportConfig(ExportConfigRequest) returns (ExportConfigResponse);

  // Logs (sections 11.2 and 11.3): a release's output or the access log,
  // and reopening every log file after an external rotation.
  rpc TailLogs(TailLogsRequest) returns (stream LogLine);
  rpc ReopenLogs(ReopenLogsRequest) returns (ReopenLogsResponse);

  // Metrics (section 11.1): the node's Prometheus text exposition.
  rpc GetMetrics(GetMetricsRequest) returns (MetricsText);

  // Re-read the daemon's configuration file for what can change while
  // running (section 13.3).
  rpc ReloadConfig(ReloadConfigRequest) returns (ReloadConfigResponse);

  // Re-exec the daemon from the installed binary and replace the edge
  // (section 13.4). The daemon answers, then re-executes; the hosts and
  // the edge keep serving and the new image takes them over.
  rpc UpgradeDaemon(UpgradeDaemonRequest) returns (UpgradeDaemonResponse);

  // Ask a release's workers something (section 11.7): status, stacks,
  // tasks, inspect or logging, through the host's control connection.
  // DumpStacks and SetLogLevel of appendix B are the stacks and logging
  // operations of this one call.
  rpc Debug(DebugRequest) returns (DebugResponse);

  // Section 9.10: overlays, their state, and activating, ending,
  // previewing and promoting one.
  rpc ListOverlays(ListOverlaysRequest) returns (ListOverlaysResponse);
  rpc ControlOverlay(ControlOverlayRequest) returns (ControlOverlayResponse);
  rpc PreviewOverlay(PreviewOverlayRequest) returns (PreviewOverlayResponse);
}

message GetStatusRequest {}

message Status {
  string version = 1;
  uint32 pid = 2;
  string state_dir = 3;
  string run_dir = 4;
  string socket = 5;
  repeated string listeners = 6;    // addresses the edge serves
  uint64 started_unix_ms = 7;
  uint32 apps = 8;
  uint32 releases = 9;
  uint32 edge_pid = 10;             // the edge process serving the listeners
  string metrics = 11;              // the metrics listener's address, or empty
  string dashboard = 12;            // the dashboard's address, or empty
}

message ListAppsRequest {}

message ListAppsResponse {
  repeated App apps = 1;
}

message GetAppRequest {
  string name = 1;
}

message App {
  string name = 1;
  string current_release = 2;       // the release traffic goes to, if any
  string previous_release = 3;      // the release a rollback restores, if any
  uint64 resource_version = 4;
  uint64 created_unix_ms = 5;
  string user = 6;                  // the user its processes run as under a root daemon (section 10.9)
  string group = 7;
  string umask = 8;                 // octal
  bool maintenance = 9;             // the edge serves its maintenance page (section 4.12)
}

// A deploy names the application (created on first use) and the source.
// Settings not given come from the source's [tool.muru] table, then from
// the application's previous release, then from the defaults.
message DeployRequest {
  string app = 1;
  string source = 2;                // a directory
  string entrypoint = 3;            // module:callable, else from [tool.muru]
  string interface = 4;             // auto, wsgi or asgi
  string python = 5;                // interpreter path, else the source's .venv or the daemon's
  optional uint32 processes = 6;
  optional uint32 threads = 7;
  optional uint32 sync_threads = 8;
  optional uint32 concurrency = 9;
  string preload = 10;              // auto, true or false
  string hooks = 11;
  optional bool factory = 12;
  string factory_phase = 13;        // worker or host
  string release = 14;              // a chosen release id, else generated
  bool wait = 15;                   // return once the release serves, or fails
  optional uint64 retain_ms = 16;   // how long the superseded release stays warm; default 30 minutes, 0 to stop it
  optional uint64 max_requests = 17;        // requests a worker serves before it is replaced (section 7.7)
  optional uint64 max_lifetime_ms = 18;     // how long a worker lives before it is replaced
  optional uint64 hard_timeout_ms = 19;     // how long a request may run before its worker is replaced (section 7.6)
  optional uint64 hard_drain_grace_ms = 20; // how long a replaced worker gets to finish its other requests
  optional uint64 shutdown_timeout_ms = 21; // how long a worker told to stop gets before it is killed
  string memory_measure = 22;               // uss, pss or rss (section 7.7); the table's or uss when empty
  optional uint64 memory_soft_limit = 23;   // bytes; over it for soft_for the worker reclaims, then recycles
  optional uint64 memory_soft_for_ms = 24;
  optional bool memory_reclaim_first = 25;
  optional uint64 memory_hard_limit = 26;   // bytes; over it the worker is replaced at once
  optional uint64 memory_check_interval_ms = 27;
  repeated EnvEntry env = 28;               // environment variables (section 10.8), over the table's
  bool hold = 29;                           // start the release but leave traffic where it is, for a preview or a rollout
  optional uint64 soft_timeout_ms = 30;     // how long a request may run before it is interrupted (section 7.6)
  optional bool accel_redirect = 31;        // X-Accel-Redirect from the default mount is an internal redirect (section 4.10)
  optional bool cgi_local_redirect = 32;    // a 200 with a local Location and no body is an internal redirect
  string kind = 33;                         // workers (the default) or http, a managed HTTP server release (section 9.9)
  string profile = 34;                      // the server of an http release: gunicorn, uvicorn, granian, mod_wsgi-express or generic
  repeated string command = 35;             // the command of an http release, with {bind} where the server takes its address
  string bind = 36;                         // how an http release binds: unix (the default) or port
  optional uint32 instances = 37;           // instances of the command; 1 when absent
  string readiness_path = 38;               // the path probed until an instance answers 2xx or 3xx; any answer when empty
  optional uint64 readiness_timeout_ms = 39; // how long the instances get to be ready; 60 s when absent
  string stop_signal = 40;                  // the signal that stops an instance gracefully; the profile's when empty
  repeated string sendfile_roots = 41;      // section 4.9: directories an X-Muru-Sendfile path must lie in; the table's when empty
  optional string sendfile_header = 42;     // a second header honoured as X-Muru-Sendfile is; the table's when absent
  bool override_freeze = 43;                // deploy although an overlay freezes the application's deploys (section 9.6)
  optional bool reflection = 44;            // section 6.13: serve gRPC server reflection; the table's when absent
}

// One environment variable: a value, or a secret reference.
message EnvEntry {
  string name = 1;
  string value = 2;                 // the value, when not a secret
  string secret_store = 3;          // the store, for a secret
  string secret_key = 4;            // the key, for a secret
  bool as_file = 5;                 // deliver the secret as a file named by NAME_FILE
}

message ListReleasesRequest {
  string app = 1;                   // every application when empty
}

message ListReleasesResponse {
  repeated Release releases = 1;
}

message GetReleaseRequest {
  string app = 1;
  string release = 2;
}

message WaitReleaseRequest {
  string app = 1;
  string release = 2;
  repeated string states = 3;       // ready, failed, stopped, ...; ready and failed when empty
  uint64 timeout_ms = 4;
}

message RollbackRequest {
  string app = 1;
}

message DrainReleaseRequest {
  string app = 1;
  string release = 2;
}

// Section 9.3: a canary rollout of a candidate release against the
// baseline that serves.
message StartRolloutRequest {
  string app = 1;
  string release = 2;               // the candidate
  repeated RolloutStep steps = 3;   // in order; the last step passing promotes the candidate
  double max_error_rate = 4;        // a gate: the candidate's 5xx ratio over the step, 0.01 when 0
  uint64 max_p95_ms = 5;            // a gate: the candidate's p95 over the step; none when 0
  uint64 min_requests = 6;          // requests before the gates judge, 100 when 0
  bool approve_each_step = 7;       // wait for ResumeRollout before each step after the first
  bool override_freeze = 8;         // start although an overlay freezes the application's deploys (section 9.6)
}

message RolloutStep {
  uint32 percent = 1;               // of the application's requests
  uint64 hold_ms = 2;               // how long the step lasts before the gates decide
}

message Rollout {
  string app = 1;
  string id = 2;
  string candidate = 3;
  string baseline = 4;
  repeated RolloutStep steps = 5;
  string state = 6;                 // running, paused, awaiting_approval, promoted or rolled_back
  uint32 step = 7;                  // the current step, from 0
  uint32 percent = 8;               // the candidate's share in force
  string message = 9;
  uint64 created_unix_ms = 10;
  uint64 updated_unix_ms = 11;
  double max_error_rate = 12;
  uint64 max_p95_ms = 13;
  uint64 min_requests = 14;
  bool approve_each_step = 15;
}

message GetRolloutRequest {
  string app = 1;
  string rollout = 2;               // the latest when empty
}

message ListRolloutsRequest {
  string app = 1;                   // all applications when empty
}

message ListRolloutsResponse {
  repeated Rollout rollouts = 1;
}

message RolloutControlRequest {
  string app = 1;                   // the application's active rollout
  bool override_freeze = 2;         // promote although an overlay freezes the application's deploys
}

// Blue/green (section 9.2): move all traffic to the release now.
message PromoteReleaseRequest {
  string app = 1;
  string release = 2;
  bool override_freeze = 3;         // promote although an overlay freezes the application's deploys (section 9.6)
}

// Section 7.4: pin a group's worker count, so the autoscaler stands
// aside, or let it decide again.
message SetScaleRequest {
  string app = 1;
  string release = 2;               // the application's serving release when empty
  string group = 3;                 // default when empty
  optional uint32 processes = 4;    // the count to pin
  bool unpin = 5;                   // let the autoscaler decide again
  optional uint32 min_workers = 6;  // section 7.5: a floor until until_unix_ms, as a temporary schedule
  optional uint32 max_workers = 7;  // and a ceiling with it
  uint64 until_unix_ms = 8;         // when the floor ends
}

message SetMaintenanceRequest {
  string app = 1;
  bool on = 2;
}

message MaintenanceStatus {
  string app = 1;
  bool on = 2;
  uint64 since_unix_ms = 3;         // when it was turned on, 0 when off
}

message GetScaleStatusRequest {
  string app = 1;
  string release = 2;               // the application's serving release when empty
}

message ScaleStatus {
  string app = 1;
  string release = 2;
  repeated GroupScale groups = 3;
}

// One worker group's scaling: the policy, where it stands and what the
// autoscaler saw and did last (section 7.3 and 7.4).
message GroupScale {
  string group = 1;
  string mode = 2;                  // static, spare or target
  uint32 min_workers = 3;
  uint32 max_workers = 4;
  uint32 desired = 5;               // the count the group is being brought to
  uint32 ready = 6;                 // workers the edge routes to
  bool pinned = 7;
  bool advisory = 8;
  double slots_busy = 9;
  double slots_total = 10;
  double idle_workers = 11;         // idle worker equivalents; negative when short
  optional double queue_wait_p95_ms = 12;
  string last_decision = 13;        // what the autoscaler did last and why
  uint64 last_decision_age_ms = 14;
  uint32 reaps_last_hour = 15;
  uint32 churn_budget = 16;
  bool suspended = 17;              // scale-in suspended by the churn budget
  string policy = 18;               // the policy as one phrase
  uint64 scale_outs = 19;
  uint64 scale_ins = 20;
  uint32 floor = 21;                // the fewest workers, with what schedules and overlays set (section 7.5)
  uint32 ceiling = 22;              // the most workers, likewise
  repeated string capacity_from = 23; // the overlays and schedules setting capacity now
  bool scale_in_held = 24;          // a schedule holds scale-in
}

// Section 9.1: pending, starting, warming, ready, draining, stopping,
// stopped and failed.
message Release {
  string app = 1;
  string id = 2;
  string state = 3;
  string message = 4;               // why it failed, or what it is doing
  string source = 5;
  string entrypoint = 6;
  string interface = 7;
  string python = 8;
  uint32 processes = 9;
  uint32 threads = 10;
  uint32 sync_threads = 11;
  uint32 concurrency = 12;
  bool serving = 13;                // traffic goes to it
  uint64 created_unix_ms = 14;
  uint64 resource_version = 15;
  repeated Worker workers = 16;
  uint64 retained_until_unix_ms = 17; // for a retained release, when it is stopped
  string kind = 18;                 // workers or http (section 9.9)
  string profile = 19;              // the server of an http release
  uint32 instances = 20;            // instances of an http release's command
  repeated string command = 21;     // the command of an http release
}

message Worker {
  uint32 index = 1;
  uint32 pid = 2;
  string socket = 3;
}

message ListEventsRequest {
  uint64 after = 1;                 // sequence number; 0 for the oldest kept
  uint32 limit = 2;
}

message ListEventsResponse {
  repeated Event events = 1;
}

message WatchEventsRequest {
  uint64 after = 1;
}

// Section 11.5: one stream of state changes.
message Event {
  uint64 sequence = 1;
  uint64 time_unix_ms = 2;
  string type = 3;                  // for example release.ready
  string subject = 4;               // app, app@release
  string level = 5;                 // info, notice, warning, error
  string message = 6;
}

message ShutdownRequest {
  bool drain = 1;                   // stop releases and the edge first
}

message ShutdownResponse {}

message DebugRequest {
  string app = 1;
  string release = 2;               // the application's current release when empty
  string op = 3;                    // status, stacks, tasks, inspect or logging
  optional uint32 worker = 4;       // one worker, else every worker
  string args_json = 5;             // the operation's arguments as a JSON object
}

message DebugResponse {
  repeated WorkerDebug workers = 1;
  string release = 2;               // the release asked
}

// One worker's answer.
message WorkerDebug {
  uint32 index = 1;
  uint32 pid = 2;
  bool ok = 3;
  string error = 4;                 // when not ok
  string result_json = 5;           // the operation's result, when ok
}

message ListOverlaysRequest {}

message ListOverlaysResponse {
  repeated OverlayInfo overlays = 1;
}

// An overlay as declared, with its state (section 9.10).
message OverlayInfo {
  string name = 1;
  bool active = 2;
  string state = 3;                 // schedule or manual while active; ended, skipped or promoted while held; empty when idle
  uint64 since_unix_ms = 4;         // when the state began; 0 when idle
  uint64 until_unix_ms = 5;         // when it ends or the hold lifts; 0 for none
  string trigger = 6;               // its schedule, or "by hand"
  repeated string changes = 7;      // what it changes, as route NAME and app NAME
  uint64 starts_unix_ms = 8;        // when its schedule's window begins, if that is to come; 0 otherwise
}

message ControlOverlayRequest {
  string name = 1;
  string action = 2;                // activate, end or promote
  uint64 until_unix_ms = 3;         // for activate: when it ends; never when 0
}

message ControlOverlayResponse {
  string message = 1;               // what happened
}

message PreviewOverlayRequest {
  string name = 1;
}

message PreviewOverlayResponse {
  repeated string changes = 1;      // what activating it now would change, one line per field
}

message UpgradeDaemonRequest {}

message UpgradeDaemonResponse {
  string executable = 1;            // the binary the daemon re-executes from
  string version = 2;               // the version that binary reports
}

// A document as muructl apply reads it: TOML with [app.NAME.release.ID]
// tables, source paths already absolute.
message ApplyConfigRequest {
  string document = 1;
  bool dry_run = 2;                 // report the plan and change nothing
  bool prune = 3;                   // also remove what the document does not contain
  bool override_freeze = 4;         // deploy releases of applications an overlay freezes (section 9.6)
}

message DiffConfigRequest {
  string document = 1;
}

// What an apply would do, or did. With errors nothing is applied.
message ConfigReport {
  repeated string errors = 1;       // validation: unknown keys, bad values, missing sources, immutable releases
  repeated string warnings = 2;     // what the daemon took no action on
  repeated ConfigChange changes = 3;
  uint32 unchanged = 4;             // releases already as declared
  bool applied = 5;                 // the changes were carried out
}

message ConfigChange {
  string action = 1;                // create-app, deploy, drain, remove-release, remove-app
  string subject = 2;               // app, or app@release
  string detail = 3;                // what the release runs, or why it goes
  string outcome = 4;               // after an apply: ready, failed: ..., stopped, removed
}

message ExportConfigRequest {
  string app = 1;                   // one application, else all
  bool all_releases = 2;            // every release, not only the one that serves
  bool effective = 3;               // routes as the active overlays leave them (section 9.10)
}

message ExportConfigResponse {
  string document = 1;              // TOML
  string version = 2;               // the daemon's version
  string node = 3;                  // the host name
  uint64 time_unix_ms = 4;
  uint64 state_version = 5;         // the last event sequence number
  repeated string attributions = 6; // with effective: what each active overlay sets that is in force
}

message ListHostsRequest {}

message ListHostsResponse {
  repeated Host hosts = 1;
}

message Host {
  string name = 1;
  repeated string names = 2;
  repeated string listeners = 3;      // every listener when empty
  bool tls = 4;                       // has a certificate
  string certificate = 5;             // the certificate file
  string canonical = 6;
  bool https_redirect = 7;
  bool use_canonical_name = 8;
  bool default = 9;
}

message ListRoutesRequest {}

message ListRoutesResponse {
  repeated Route routes = 1;
}

message Route {
  string host = 1;
  string path = 2;
  string app = 3;                   // empty for a static route
  string static_dir = 4;            // the directory, for a static route (section 4.9)
  string fallback_app = 5;          // the application behind a static route, when there is one
  repeated TrafficShare traffic = 6; // the traffic policy's shares (section 9.4), empty without one
  bool sticky = 7;
  string hash_key = 8;              // the policy's key, when it names one
  bool internal = 9;                // reachable only through internal redirects (section 4.10)
  repeated string accept_redirects_from = 10; // other applications whose redirects may reach the route
  string auth = 11;                 // "APP PATH" when an authentication sub-request guards the route (section 4.16)
  string upstream = 12;             // the upstream that takes the requests (section 4.13), for an upstream route
  string fallback_upstream = 13;    // the upstream behind a static route, when there is one
  string upload = 14;               // multipart or raw when the edge receives uploads (section 4.11), with ", precheck"
  string max_body_size = 15;        // the route's own body limit, as configured (section 4.6)
}

message ListUpstreamsRequest {}

message ListUpstreamsResponse {
  repeated Upstream upstreams = 1;
}

// An HTTP upstream (section 4.13), as applied.
message Upstream {
  string name = 1;
  repeated string addresses = 2;
  string protocol = 3;              // http1, h2c or h2
  bool tls = 4;
  string health_path = 5;           // the path probed, when one is
  bool trust_muru_headers = 6;
}

// One release's share of a route's requests, in percent.
message TrafficShare {
  string release = 1;
  uint32 percent = 2;
}

// Which log to show: a release's output (its host's and workers' lines,
// tagged by the host), or the access log the edge writes.
message TailLogsRequest {
  string app = 1;                   // unused with access
  string release = 2;               // empty: the application's current release
  bool follow = 3;                  // keep streaming as lines arrive
  uint32 lines = 4;                 // how many recent lines first; 0 for none
  bool access = 5;                  // the access log instead of a release
}

message LogLine {
  string app = 1;
  string release = 2;
  string line = 3;
}

message ReopenLogsRequest {
  bool workers = 1;                 // also run on_reopen_logs in every worker
}

message ReopenLogsResponse {
  bool edge = 1;                    // the edge was told
  uint32 hosts = 2;                 // hosts told
}

message GetMetricsRequest {}

message MetricsText {
  string text = 1;                  // the Prometheus text exposition
}

message ReloadConfigRequest {}

message ReloadConfigResponse {
  string message = 1;               // what was reloaded
}
