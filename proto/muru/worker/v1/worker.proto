// Worker protocol between the edge and Python workers (design specification
// section 5). Requests travel on the framed link, whose structured payloads
// are the messages below; the Worker service is the control plane, served
// from phase 2. Messages change additively within a major version.

syntax = "proto3";

package muru.worker.v1;

// Control plane, over gRPC on the worker's control socket (section 5.9).
service Worker {
  // Load, memory, GIL and loop signals.
  rpc Status(StatusRequest) returns (StatusReply);
  // Drain, reopen logs, log levels, stacks, precheck mode.
  rpc Control(ControlRequest) returns (ControlReply);
}

// Payload of a HELLO frame, exchanged once per connection in both directions
// (section 5.2). The worker fills in every field; the edge sends only the
// version.
message Hello {
  string protocol_version = 1;
  string worker_type = 2;           // wsgi or asgi
  uint32 slots = 3;                 // requests the worker runs at once
  uint32 async_slots = 4;           // requests the worker holds on its event loop at once
  bool websockets = 5;              // accepts websocket scopes
  bool files = 6;                   // accepts FILE frames
  uint32 max_message_size = 7;      // largest WebSocket message, bytes
  repeated GrpcMethod grpc_methods = 8; // the gRPC methods its mounts registered (section 6.13)
  repeated MountPool mount_pools = 9; // mounts with slots or connections of their own (section 6.7)
}

// A mount's own slots (section 6.7). For a WSGI mount, reserved threads
// only it uses and the most requests it runs at once; requests beyond the
// reserved threads, up to the maximum, borrow threads of the shared pool.
// For an ASGI mount, reserved and max are both its concurrency, or 0 for
// one that shares the worker's slots, and connections bounds the open
// WebSockets it holds apart from the requests it runs, 0 for no bound of
// its own.
message MountPool {
  string mount = 1;
  uint32 reserved = 2;
  uint32 max = 3;
  uint32 connections = 4;
}

// A gRPC method a worker serves (section 6.13). A path ending in / is a
// whole service whose methods were not listed, taken as streaming both
// ways.
message GrpcMethod {
  string path = 1;                  // /package.Service/Method, or /package.Service/
  string mount = 2;                 // the mount that registered it, empty for the default
  bool client_streaming = 3;
  bool server_streaming = 4;
}

// Payload of a REQUEST frame.
message RequestHead {
  string protocol_version = 1;      // worker protocol version, for example 1.0
  string request_id = 2;
  string method = 3;
  string scheme = 4;
  bytes raw_path = 5;               // as received, percent-encoded
  bytes query = 6;
  repeated Header headers = 7;      // ordered raw byte pairs
  Peer client = 8;                  // resolved client
  Peer server = 9;
  Peer proxy = 10;                  // original peer when behind trusted proxies
  TlsInfo tls = 11;
  string mount = 12;
  string script_name = 13;
  string route = 14;
  string release = 15;
  uint64 deadline_unix_ms = 16;
  optional uint64 content_length = 17;
  bool body_buffered = 18;
  uint64 max_body_size = 19;
  InternalContext internal = 20;    // REDIRECT_* values, trusted redirect headers, error reason
  map<string, string> host_captures = 21;
  repeated UploadRef uploads = 22;  // descriptors passed with the request head
  bool precheck = 23;
  string http_version = 24;         // for example HTTP/1.1, for SERVER_PROTOCOL
  Scope scope = 25;                 // http unless the request is a WebSocket upgrade or a gRPC call
  bool expect_continue = 26;        // the client waits for 100 Continue before sending the body (section 5.5)
  string server_name = 27;          // the virtual host name matched, or its canonical name (section 4.3); SERVER_NAME when set
  string client_class = 28;         // section 4.14: the class the edge assigned, default when no rule matched
  string mode = 29;                 // section 4.15: the route's site mode, as muru.mode; none when empty
  bool borrowed = 30;               // section 6.7: the edge gave the request a shared thread its mount borrows
}

// What a REQUEST frame opens (sections 5.6 and 6.13). A gRPC call's
// request and response bodies are MESSAGE frames, one whole message each,
// already unframed and decompressed by the edge; the response's END
// carries the status in its trailers.
enum Scope {
  SCOPE_HTTP = 0;
  SCOPE_WEBSOCKET = 1;
  SCOPE_GRPC = 2;
}

message Header {
  bytes name = 1;                   // lower case
  bytes value = 2;
}

message Peer {
  string address = 1;
  uint32 port = 2;
}

// The TLS connection a request arrived on, absent for cleartext.
message TlsInfo {
  string version = 1;               // for example TLSv1.3
  string cipher = 2;                // negotiated cipher suite, for example TLS13_AES_256_GCM_SHA384
  string server_name = 3;           // the name the client asked for (SNI), if any
  string alpn = 4;                  // negotiated application protocol, for example h2
  string ja4 = 5;                   // the ClientHello's JA4 fingerprint (section 4.14), if it was read
}

// How a request arrived by internal redirect (section 4.10): what the
// application that redirected it was asked for, and the trusted headers
// it added.
message InternalContext {
  string redirect_url = 1;          // the path the client asked for, as REDIRECT_URL
  string redirect_query_string = 2; // its query string
  uint32 redirect_status = 3;       // the status the redirecting application answered
  repeated Header headers = 4;      // headers added with X-Muru-Redirect-Header-NAME
  uint32 hop = 5;                   // 1 for the first redirect, up to the limit
  string error_reason = 6;          // for an error page sub-request (section 4.12): the reason of the error, as muru.error_reason
  bool auth_request = 7;            // an authentication sub-request (section 4.16): muru.auth_request, with the original request below and no REDIRECT_* keys
  string original_method = 8;       // the protected request's method, as muru.original_method
  string original_uri = 9;          // its path and query, as muru.original_uri
  string original_host = 10;        // the host it asked for, as muru.original_host
}

// Section 4.11: a file the edge received and stored for the request,
// whose descriptor is attached to the REQUEST frame; the descriptors are
// matched to these by order.
message UploadRef {
  string ref = 1;                   // unique within the request, as the form's FIELD.ref
  string field = 2;                 // the form field; empty for a raw upload
  string filename = 3;              // the client's file name; may be empty
  string content_type = 4;          // as the client declared it; may be empty
  uint64 size = 5;                  // bytes received
  map<string, string> digests = 6;  // hex digests by algorithm, such as sha256
  string path = 7;                  // the spool file's name where it has one (not on Linux); empty otherwise
}

// Payload of a FILE frame (section 5.7): the response body, or the next
// piece of it, is `length` bytes of the file whose descriptor is attached
// to the frame, from `offset`. The END flag ends the body with it.
message FileHint {
  uint64 offset = 1;
  uint64 length = 2;
}

// How the worker should flush response body chunks (section 5.4).
enum FlushPolicy {
  FLUSH_POLICY_UNSPECIFIED = 0;     // the worker's configured default
  FLUSH_POLICY_COALESCE = 1;
  FLUSH_POLICY_IMMEDIATE = 2;
}

// Payload of a RESPONSE frame.
message ResponseHead {
  uint32 status = 1;
  repeated Header headers = 2;      // ordered, as the application gave them
  FlushPolicy flush = 3;
  string reason = 4;                // the application's reason phrase, for HTTP/1.1
}

// Payload of an END frame: the end of a body in one direction.
message End {
  repeated Header trailers = 1;
  string error = 2;                 // non-empty when the body is incomplete
  string reason = 3;                // Appendix C.3 reason when the worker failed before its response head, for example app_error
  string detail = 4;                // the traceback or similar, shown by the edge in development mode only
}

// Payload of a CLOSE frame in either direction: the end of a WebSocket
// (section 5.6). Edge to worker it is websocket.disconnect; worker to edge
// it is the application closing.
message Close {
  uint32 code = 1;                  // a WebSocket close code, 1000 when none was given
  string reason = 2;
  bool draining = 3;                // the worker closed it because it is stopping, not the application
}

// Payload of an ABORT frame, edge to worker: the client has gone, or the
// response ended before the request body did (section 5.5).
message Abort {
  string reason = 1;
}

// Payload of a DETACH frame, worker to edge: the request moved to the
// other side of the worker, so the edge counts its connection against the
// other bound (section 6.14).
message Detach {
  enum Target {
    TARGET_LOOP = 0;                // now held on the event loop: async slots
    TARGET_THREADS = 1;             // now on an application thread: slots
  }
  Target target = 1;
}

message StatusRequest {}

message StatusReply {
  string protocol_version = 1;
  uint32 pid = 2;
  uint32 in_flight = 3;
  uint64 requests_total = 4;
  string python_version = 5;
  bool free_threaded = 6;
  bool gc_enabled = 7;
  uint64 gc_frozen = 8;             // objects in the permanent generation
}

message ControlRequest {}

message ControlReply {}
