entrypoint = "handoff:application"
handoff = "asgi"
hooks = "handoff_hooks"
threads = 2

[mounts.plain]
path = "/plain"
entrypoint = "handoff:plain"
interface = "wsgi"

[mounts.api]
path = "/api"
entrypoint = "handoff:api"
interface = "asgi"
handoff = "wsgi"
threads = 1

[mounts.asyncplain]
path = "/async-plain"
entrypoint = "handoff:api"
interface = "asgi"
