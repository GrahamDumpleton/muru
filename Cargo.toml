[workspace]
resolver = "2"
members = ["crates/*"]

# muru-py needs a Python interpreter to build, so plain `cargo check` and
# `cargo test` leave it out; `just dev` builds it through maturin.
default-members = [
    "crates/muructl",
    "crates/muru-common",
    "crates/muru-config",
    "crates/muru-proto",
    "crates/muru-edge",
    "crates/muru-controller",
    "crates/muru-supervisor",
    "crates/muru-dashboard",
    "crates/muru-testkit",
]

[workspace.package]
# The only place the project version is stated. Change it with `just bump`.
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/GrahamDumpleton/muru"
homepage = "https://github.com/GrahamDumpleton/muru"
authors = ["Graham Dumpleton"]
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
brotli = "8"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
globset = "0.4"
httpdate = "1"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "http2", "server", "client"] }
ignore = "0.4"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client", "client-legacy", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "http2", "tls12", "webpki-tokio"] }
jiff = "0.2"
libc = "0.2"
mime_guess = "2"
multer = "3.1"
muru-common = { path = "crates/muru-common" }
muru-dashboard = { path = "crates/muru-dashboard" }
muru-config = { path = "crates/muru-config" }
muru-controller = { path = "crates/muru-controller" }
muru-edge = { path = "crates/muru-edge" }
muru-proto = { path = "crates/muru-proto" }
percent-encoding = "2"
prost = "0.14"
protoc-bin-vendored = "3"
pyo3 = { version = "0.30", features = ["extension-module"] }
# TLS runs on the ring provider everywhere (ADR 0024): no aws-lc-rs, so no
# cmake. Keep every rustls-family crate on the same provider features.
rusqlite = { version = "0.40", features = ["bundled"] }
regex = "1"
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"
toml = "1.1"
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal", "process", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "server", "channel", "router"] }
zstd = "0.14.3"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
