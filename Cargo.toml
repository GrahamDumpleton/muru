[workspace]
resolver = "2"
members = ["crates/*"]

# muru-py needs a Python interpreter to build, so plain `cargo check` and
# `cargo test` leave it out; `just dev` builds it through maturin.
default-members = [
    "crates/muructl",
    "crates/muru-common",
    "crates/muru-config",
    "crates/muru-proto",
    "crates/muru-edge",
    "crates/muru-controller",
    "crates/muru-supervisor",
    "crates/muru-dashboard",
    "crates/muru-testkit",
]

[workspace.package]
# The only place the project version is stated. Change it with `just bump`.
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/GrahamDumpleton/muru"
homepage = "https://github.com/GrahamDumpleton/muru"
authors = ["Graham Dumpleton"]
publish = false

[workspace.dependencies]
anyhow = "1"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
http = "1.3"
http-body = "1.0"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
libc = "0.2"
muru-common = { path = "crates/muru-common" }
muru-edge = { path = "crates/muru-edge" }
muru-proto = { path = "crates/muru-proto" }
prost = "0.14"
protoc-bin-vendored = "3"
pyo3 = { version = "0.30", features = ["extension-module"] }
thiserror = "2"
tokio = { version = "1.47", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal", "process", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "server", "channel", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
