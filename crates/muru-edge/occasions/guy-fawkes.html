<style>
body { background: #1a120c; color: #f7ebdc; }

.flame { transform-box: fill-box; transform-origin: bottom center; animation: flicker 0.5s ease-in-out infinite alternate; }
.f2 { animation-delay: 0.17s; }
.f3 { animation-delay: 0.33s; }
.spark { animation: rise 2.2s ease-out infinite; }
.s2 { animation-delay: 0.7s; }
.s3 { animation-delay: 1.4s; }
.rocket { animation: launch 3s ease-in infinite; }
@keyframes flicker { from { transform: scaleY(0.9) scaleX(1.05); } to { transform: scaleY(1.1) scaleX(0.95); } }
@keyframes rise { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
@keyframes launch { 0% { transform: translate(0, 0); opacity: 1; } 70% { transform: translate(30px, -150px); opacity: 1; } 71%, 100% { opacity: 0; } }
</style>
