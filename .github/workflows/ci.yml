# Required checks for pull requests and pushes (design specification section 16).
# The job set grows with each phase. Pin actions to commit hashes before the
# first release.

name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sh scripts/check-no-em-dashes.sh
      - run: uv sync --only-group dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude muru-py --all-targets -- -D warnings

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude muru-py

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --exclude muru-py

  extension:
    # The PyO3 extension needs an interpreter to build, so it is compiled here
    # rather than in the workspace-wide jobs, for a regular and a free-threaded build.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.15", "3.15t"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: uv python install ${{ matrix.python }}
      - run: echo "PYO3_PYTHON=$(uv python find ${{ matrix.python }})" >> "$GITHUB_ENV"
      - run: cargo clippy -p muru-py --all-targets -- -D warnings

  integration:
    # muructl run end to end: preload, fork, the worker link and the WSGI bridge,
    # on a regular and a free-threaded interpreter (phase 0 exit criteria).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.15", "3.15t"]
        include:
          - os: macos-latest
            python: "3.15"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --only-group dev --only-group fixtures --python ${{ matrix.python }}
      - run: cd packages/muru && uv run --project ../.. maturin develop
      - run: cargo build -p muructl
      - run: bash packaging/dev/fetch-h2spec.sh
      - run: uv run pytest tests/integration tests/conformance

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.15"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --only-group dev
      - run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --only-group docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      # The PDF is built on Read the Docs; this checks its LaTeX source builds cleanly.
      - run: uv run sphinx-build -W --keep-going -b latex docs docs/_build/latex

  ci-ok:
    # One check for branch rules to require, so the job list and matrices can
    # change without the rules going stale. Fails if any job did not succeed.
    needs: [lint, rust, msrv, extension, integration, python, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo 'A required job did not succeed:'
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "all jobs succeeded"
